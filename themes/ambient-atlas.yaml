Alpine Morning:
  primary-color: "#426f88"
  accent-color: "#c49351"
  ha-card-border-radius: "18px"
  ha-card-box-shadow: "0 8px 26px rgba(34, 58, 71, 0.10)"
  modes:
    light:
      primary-background-color: "#eef4f5"
      secondary-background-color: "#e2ebed"
      card-background-color: "rgba(251, 253, 253, 0.89)"
      primary-text-color: "#2d3d45"
      secondary-text-color: "#5f737c"
      disabled-text-color: "#8c9ba0"
      divider-color: "rgba(53, 77, 84, 0.13)"
      app-header-background-color: "rgba(246, 250, 250, 0.94)"
      app-header-text-color: "#2d3d45"
      sidebar-background-color: "rgba(239, 246, 247, 0.96)"
      sidebar-text-color: "#455c65"
      sidebar-selected-background-color: "rgba(66, 111, 136, 0.15)"
      lovelace-background: "radial-gradient(ellipse at 13% 9%, rgba(131, 188, 201, 0.44) 0%, transparent 40%), radial-gradient(ellipse at 88% 12%, rgba(222, 190, 129, 0.39) 0%, transparent 38%), linear-gradient(145deg, #e6f1f1 0%, #e8eff3 54%, #f1eee6 100%)"
      ha-card-backdrop-filter: "blur(11px)"
      state-active-color: "#426f88"
      state-unavailable-color: "#8c9ba0"
    dark:
      primary-background-color: "#17232a"
      secondary-background-color: "#202e35"
      card-background-color: "rgba(36, 50, 58, 0.91)"
      primary-text-color: "#e8eff0"
      secondary-text-color: "#b6c5c7"
      disabled-text-color: "#78898e"
      divider-color: "rgba(205, 222, 223, 0.13)"
      app-header-background-color: "rgba(23, 36, 43, 0.95)"
      app-header-text-color: "#e8eff0"
      sidebar-background-color: "rgba(20, 32, 39, 0.97)"
      sidebar-text-color: "#cad6d7"
      sidebar-selected-background-color: "rgba(124, 183, 193, 0.19)"
      lovelace-background: "radial-gradient(ellipse at 13% 9%, rgba(51, 105, 119, 0.53) 0%, transparent 40%), radial-gradient(ellipse at 88% 12%, rgba(130, 101, 61, 0.4) 0%, transparent 38%), linear-gradient(145deg, #162229 0%, #1e2b34 54%, #292820 100%)"
      ha-card-backdrop-filter: "blur(11px)"
      state-active-color: "#91c8d0"
      state-unavailable-color: "#78898e"

