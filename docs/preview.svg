      <text x="28" y="143" font-size="16" fill="#5f737c">Glacier blue · pine · sunrise</text>
      <rect x="28" y="184" width="312" height="88" rx="17" fill="#fff" opacity=".78"/>
      <rect x="28" y="292" width="148" height="86" rx="17" fill="#fff" opacity=".72"/>
