<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Ambient Atlas theme previews</title>
  <desc id="desc">Three dashboard palette illustrations: Alpine Morning, Circuit Garden, and Moonlit Atelier.</desc>
  <defs>
    <linearGradient id="alpine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2f0ef"/><stop offset=".53" stop-color="#e4edf3"/><stop offset="1" stop-color="#f1eee3"/></linearGradient>
    <linearGradient id="garden" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f0dd"/><stop offset=".53" stop-color="#e2eee7"/><stop offset="1" stop-color="#e9eaf3"/></linearGradient>
    <linearGradient id="atelier" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ebe6f3"/><stop offset=".53" stop-color="#e7e8ef"/><stop offset="1" stop-color="#f3e9e0"/></linearGradient>
  </defs>
  <rect width="1200" height="460" rx="28" fill="#f5f6f7"/>
